name: Auto-Refresh SparkDeals Live Feed

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-deals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch latest verified deals & Black Friday offers
        env:
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          AMAZON_INDIA_TAG: ${{ secrets.AMAZON_INDIA_TAG }}
        run: node scripts/refresh-deals.mjs
      - name: Commit updated live deals feed if changed
        run: |
          git config user.name "sparkdeals-bot"
          git config user.email "actions@radiantsparkllc.com"
          git add public/deals-feed.json
          if git diff --staged --quiet; then
            echo "No new deal updates."
          else
            git commit -m "chore(deals): auto-sync verified live deals & Black Friday offers"
            git push
          fi
