<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Radiant Spark Global - SparkDeal Hub &amp; SparkSync</title>
    <meta name="description" content="Curated Indian affiliate deal grid (SparkDeal Hub), comprehensive India Legal Shield (IT Act Intermediary &amp; Consumer Protection compliance), high-visibility SparkSync automated launcher, and dual-market US Technology and India Industry structure." />
    <meta property="og:title" content="Radiant Spark Global - SparkDeal Hub &amp; SparkSync" />
    <meta property="og:description" content="Curated Indian affiliate deal grid (SparkDeal Hub), comprehensive India Legal Shield (IT Act Intermediary &amp; Consumer Protection compliance), high-visibility SparkSync automated launcher, and dual-market US Technology and India Industry structure." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Install Manifest -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#030712" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SparkSync" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS CDN for styling parity across React shell -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      html, body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #030712;
        color: #f8fafc;
        overflow-x: hidden;
        overflow-y: auto;
        height: auto;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #030712; }
      ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }

      @keyframes ticker {
        0% { transform: translateX(0%); }
        100% { transform: translateX(-50%); }
      }
      .animate-ticker {
        display: inline-flex;
        animation: ticker 36s linear infinite;
        will-change: transform;
      }
    </style>
  </head>
  <body class="bg-[#030712] text-slate-100 min-h-screen selection:bg-blue-600 selection:text-white font-sans antialiased overflow-x-hidden">
    <div id="root"></div>

    <!-- React App Hydration -->
    <script type="module" src="/src/main.tsx"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
