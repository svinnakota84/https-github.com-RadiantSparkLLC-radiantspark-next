name: Refresh Deals & Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh real-time deals & Black Friday 2026 offers
        env:
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          AMAZON_INDIA_TAG: ${{ secrets.AMAZON_INDIA_TAG }}
          WALMART_IMPACT_ID: ${{ secrets.WALMART_IMPACT_ID }}
          BESTBUY_IMPACT_ID: ${{ secrets.BESTBUY_IMPACT_ID }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
          SKIMLINKS_PUBLISHER_ID: ${{ secrets.SKIMLINKS_PUBLISHER_ID }}
          SOVRN_API_KEY: ${{ secrets.SOVRN_API_KEY }}
        run: node scripts/refresh-deals.mjs || true
      - name: Assemble GitHub Pages output
        run: |
          mkdir -p _site
          cp index.html deals-feed.json .nojekyll _site/
          cp -r assets _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deploy
